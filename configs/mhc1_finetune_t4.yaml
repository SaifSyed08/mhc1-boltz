# Boltz-1 MHC-I fine-tuning configuration for a 16 GB cloud T4.
#
# Derived from configs/mhc1_finetune_8gb.yaml, which is itself derived from
# boltz-src/scripts/train/configs/structure.yaml. The model block is still
# byte-identical to upstream except for the four values called out below, so the
# pretrained weights load without surprises.
#
# WHY THIS FILE EXISTS: TACC access did not materialise, so the fine-tune moves
# to a free-tier cloud T4 (Google Colab, or Kaggle with the "GPU T4 x2"
# accelerator selected -- use one of the two). That is 16 GB instead of the
# laptop's 8 GB, which is the difference between "OOMs in triangular attention"
# and "runs". See reports/CLOUD_GPU.md for the memory budget, the wall-clock
# budget, and the session-limit handling.
#
# Paths are relative to boltz-src/, the working directory the upstream entry
# point assumes:
#
#   python scripts/train/train.py ../configs/mhc1_finetune_t4.yaml
#
# Every value below can be overridden from the command line as a dotlist, which
# is how the notebook points `output` and `resume` at persistent storage:
#
#   python scripts/train/train.py ../configs/mhc1_finetune_t4.yaml #       output=/content/drive/MyDrive/mhc1-runs/t4 #       resume=/content/drive/MyDrive/mhc1-runs/t4/last.ckpt
#
# ---------------------------------------------------------------------------
# DEVIATIONS FROM THE UPSTREAM RECIPE, and what each one costs
# ---------------------------------------------------------------------------
#
#  1. `ema: false`                 -- saves 1.81 GB. Boltz-1 was trained with EMA
#                                     and its released weights are EMA weights,
#                                     so this is a real deviation, not a free
#                                     one. It is the cheapest 1.81 GB available
#                                     and it is reversible on a bigger card.
#
#  2. `freeze_trunk`               -- msa_module + pairformer_module frozen,
#                                     150.6M of 432M params. Drops gradients and
#                                     Adam moments for the trunk AND the
#                                     activations autograd would retain for its
#                                     backward pass. Ernest endorsed this
#                                     explicitly; it is also defensible on the
#                                     merits, since pMHC-I is mostly the geometry
#                                     of a peptide in a groove rather than
#                                     representation learning.
#
#  3. `offload_to_cpu: false`      -- OFF, and the history here is worth keeping
#                                     because it explains why the earlier
#                                     reasoning kept missing.
#
#                                     fairscale's checkpoint_wrapper saves each
#                                     block's inputs unconditionally
#                                     (checkpoint_activations.py:278) but then
#                                     DETACHES the output when nothing upstream
#                                     and no local parameter requires grad
#                                     (:297, :199/:210) -- which releases those
#                                     saved inputs immediately.
#
#                                     Under the OLD partial freeze
#                                     (msa_module + pairformer_module only),
#                                     z was built by z_init_*/rel_pos/token_bonds
#                                     from input_embedder, all still trainable,
#                                     so nothing detached and all 48 blocks
#                                     retained z[1,512,512,128] = 134 MB each,
#                                     about 6.5 GB. Offloading that to host RAM
#                                     was a real win.
#
#                                     Under the FULL freeze below, nothing
#                                     upstream requires grad, the outputs detach,
#                                     and those tensors are never retained at all.
#                                     Offload now buys nothing -- while still
#                                     paying a device-to-host copy of the same
#                                     ~6.5 GB every step. That is a plausible
#                                     chunk of the measured 85 s/batch.
#
#                                     Activation checkpointing stays on; it is the
#                                     offload that is redundant.
#
#  4. `accumulate_grad_batches: 16` -- was 128. THIS IS THE IMPORTANT ONE, and it
#                                     is a wall-clock decision, not a memory one.
#                                     `samples_per_epoch: 100` with
#                                     `batch_size: 1` is 100 batches per epoch,
#                                     so accumulating 128 means the optimizer
#                                     steps roughly once per epoch -- and on a T4
#                                     an epoch is hours. A 12 h session would buy
#                                     a single-digit number of optimizer steps,
#                                     which is not an experiment. 16 gives ~6
#                                     steps per epoch at an effective batch of
#                                     16. Report the effective batch size when
#                                     reporting results; do not describe this as
#                                     the upstream recipe.
#
# NOT deviated from, deliberately: max_tokens (512), diffusion_multiplicity (16),
# crop size, and the validation_args. Those change the objective or the metric,
# and a number produced under a changed metric cannot be compared to the
# pretrained baseline in reports/BASELINE.md.
#
# ---------------------------------------------------------------------------
# PRECISION NOTE
# ---------------------------------------------------------------------------
# `precision: 32` is kept. A T4 is Turing (sm_75): it has no bf16 and no TF32, so
# the two cheap precision wins available on Ampere+ simply do not exist on this
# card. fp16 AMP does exist, but AlphaFold3-style triangular attention is exactly
# the kind of softmax-over-large-bias arithmetic that overflows in fp16, and a
# silently-NaN fine-tune is worse than a slow one. If this run later moves to an
# L4 or A100, set `precision: bf16-mixed` and `matmul_precision: high` -- both are
# real speedups there and neither is a recipe change.

trainer:
  accelerator: gpu
  devices: 1
  precision: 32
  gradient_clip_val: 10.0
  max_epochs: -1
  accumulate_grad_batches: 16       # DEVIATION: was 128. See header note 4.

  # Kaggle kills a committed run at 12 h, and its output upload after an overrun
  # is explicitly best-effort -- Kaggle staff: "Sometimes it will work, sometimes
  # it will get skipped." With max_epochs: -1 every session is GUARANTEED to
  # overrun, so every session was gambling its own checkpoint. Stop cleanly with
  # hours to spare for the ~8 GB of checkpoints to upload inside the window.
  # Colab's cap is also 12 h. Override for a shorter session.
  max_time: "00:09:30:00"           # d:hh:mm:ss

wandb: null                           # no run tracking; the notebook tails the log instead

output: ../runs/finetune_t4         # override from the CLI to point at Drive
pretrained: ../data/assets/boltz1_conf.ckpt   # 606M params; resume from pretrained weights
resume: null
debug: false                        # false so num_workers is honoured; wandb is off via `wandb: null`
disable_checkpoint: false
matmul_precision: null              # no-op on Turing (no TF32); set to `high` on Ampere+
# LOCAL: wall-clock checkpointing. An epoch is ~2.4 h of training plus an
# expensive validation pass, against a 12 h session cap -- upstream's
# once-per-epoch save can leave a whole session with nothing written, and
# ModelCheckpoint has no on_train_end hook in PL 2.4 to catch it on the way out.
# 30 min bounds what a kill costs. Mutually exclusive with every_n_epochs; the
# patched train.py picks one.
ckpt_every_minutes: 30

save_top_k: 1                        # DEVIATION: was -1 (keep every epoch).
                                    # A Lightning checkpoint here is ~4 GB --
                                    # 1.73 GB of weights (432M x fp32) plus
                                    # ~2.25 GB of Adam moments for the 281.6M
                                    # trainable params. `save_top_k: -1` writes
                                    # one per epoch and would fill a 15 GB free
                                    # Drive in three epochs. 1 + `save_last`
                                    # (always on) is the best model plus the
                                    # resume point, which is what a
                                    # session-limited run actually needs.

data:
  datasets:
    - _target_: boltz.data.module.training.DatasetConfig
      target_dir: ../data/processed
      msa_dir: ../data/msa
      manifest_path: ../data/processed/manifest.json
      prob: 1.0
      sampler:
        _target_: boltz.data.sample.cluster.ClusterSampler
      cropper:
        _target_: boltz.data.crop.boltz.BoltzCropper
        min_neighborhood: 0
        max_neighborhood: 40
      split: ../data/processed/validation_ids_subset30.txt

  filters:
    - _target_: boltz.data.filter.dynamic.size.SizeFilter
      min_chains: 1
      max_chains: 300
    - _target_: boltz.data.filter.dynamic.date.DateFilter
      date: "2021-09-30"
      ref: released
    - _target_: boltz.data.filter.dynamic.resolution.ResolutionFilter
      resolution: 9.0

  tokenizer:
    _target_: boltz.data.tokenize.boltz.BoltzTokenizer
  featurizer:
    _target_: boltz.data.feature.featurizer.BoltzFeaturizer

  symmetries: ../data/assets/symmetry.pkl
  max_tokens: 512
  # MEASURED over all 1013 manifest records, valid chains only: atoms max out at
  # 3896 (p50 3157, p99 3648). Upstream's 4608 is sized for general PDB complexes
  # and leaves ~18% of every atom tensor as pad on this dataset. 3904 is the
  # smallest legal value (featurizer.py:851 asserts max_atoms % 32 == 0) that
  # still crops ZERO samples, so this is not an objective change -- it is the
  # same data with less padding. It shrinks every atom-level tensor by ~28%,
  # including the [batch*multiplicity, n_atoms, n_atoms] matrices in
  # smooth_lddt_loss that the OOM lands in.
  #
  # Do NOT lower max_tokens the same way: tokens max out at 494, so 512 already
  # crops nothing, and 384 would crop 588 of 1013 records (58%) -- a real
  # objective change. Residue counts say 545; the crop unit is tokens, and
  # non-standard residues tokenize per-atom.
  max_atoms: 3904
  max_seqs: 2048
  pad_to_max_tokens: true
  pad_to_max_atoms: true
  pad_to_max_seqs: true
  samples_per_epoch: 100
  batch_size: 1
  num_workers: 2                      # free Colab has 2 vCPUs
  random_seed: 42
  pin_memory: true
  overfit: null
  crop_validation: false
  return_train_symmetries: false
  return_val_symmetries: true
  train_binder_pocket_conditioned_prop: 0.3
  val_binder_pocket_conditioned_prop: 0.3
  binder_pocket_cutoff: 6.0
  binder_pocket_sampling_geometric_p: 0.3
  min_dist: 2.0
  max_dist: 22.0
  num_bins: 64
  atoms_per_window_queries: 32

model:
  _target_: boltz.model.model.Boltz1
  atom_s: 128
  atom_z: 16
  token_s: 384
  token_z: 128
  num_bins: 64
  atom_feature_dim: 389
  atoms_per_window_queries: 32
  atoms_per_window_keys: 128
  compile_pairformer: false
  nucleotide_rmsd_weight: 5.0
  ligand_rmsd_weight: 10.0
  ema: false                          # DEVIATION: saves 1.81 GB. See header note 1.
  ema_decay: 0.999

  embedder_args:
    atom_encoder_depth: 3
    atom_encoder_heads: 4

  msa_args:
    msa_s: 64
    msa_blocks: 4
    msa_dropout: 0.15
    z_dropout: 0.25
    pairwise_head_width: 32
    pairwise_num_heads: 4
    activation_checkpointing: true
    offload_to_cpu: false           # REVERSED AGAIN -- see header note 3.

  pairformer_args:
    num_blocks: 48
    num_heads: 16
    dropout: 0.25
    activation_checkpointing: true
    offload_to_cpu: false           # REVERSED AGAIN -- see header note 3.

  score_model_args:
    sigma_data: 16
    dim_fourier: 256
    atom_encoder_depth: 3
    atom_encoder_heads: 4
    token_transformer_depth: 24
    token_transformer_heads: 16
    atom_decoder_depth: 3
    atom_decoder_heads: 4
    conditioning_transition_layers: 2
    activation_checkpointing: true
    offload_to_cpu: false           # REVERSED AGAIN -- see header note 3.

  confidence_prediction: false
  confidence_model_args:
    num_dist_bins: 64
    max_dist: 22
    add_s_to_z_prod: true
    add_s_input_to_s: true
    use_s_diffusion: true
    add_z_input_to_z: true

    confidence_args:
      num_plddt_bins: 50
      num_pde_bins: 64
      num_pae_bins: 64

  training_args:
    recycling_steps: 3
    sampling_steps: 20
    # MEASURED 2026-09-16, confirmed by traceback rather than inferred:
    #   loss/diffusion.py:155, F.sigmoid(1.0 - dist_diff)
    #   OutOfMemoryError: Tried to allocate 932.00 MiB
    #   [16, 3904, 3904] fp32 = 930 MiB -- matched to the byte
    #
    # smooth_lddt_loss keeps ~10 of the 14.03 GiB peak and is linear in
    # multiplicity, so 8 takes peak to roughly 9 GiB on a 14.56 GiB card.
    #
    # DEVIATION, and it must be reported: upstream Boltz-1 uses 16,
    # AlphaFold-3 uses 48. At batch_size 1 this is a plain M-sample Monte-Carlo
    # estimate of a fixed objective, so halving M raises gradient variance
    # without changing what is being learned. Two caveats belong with that
    # sentence: it holds ONLY at batch_size 1 (the view/repeat_interleave
    # ordering in smooth_lddt_loss would otherwise average eps across different
    # structures), and synchronize_sigmas: true means M averages noise vectors
    # at a FIXED sigma rather than thinning the sigma schedule.
    #
    # Restoring 16 is possible without deviating -- chunk smooth_lddt_loss over
    # the multiplicity dim under torch.utils.checkpoint, which is mathematically
    # identical at batch_size 1. Not done: new code on the path that has broken
    # most often, and it needs a numerical equivalence test first.
    diffusion_multiplicity: 8
    diffusion_samples: 2
    confidence_loss_weight: 1e-4
    diffusion_loss_weight: 4.0
    distogram_loss_weight: 3e-2
    adam_beta_1: 0.9
    adam_beta_2: 0.95
    adam_eps: 0.00000001
    lr_scheduler: af3
    base_lr: 0.0
    max_lr: 0.0018
    lr_warmup_no_steps: 1000
    lr_start_decay_after_n_steps: 50000
    lr_decay_every_n_steps: 50000
    lr_decay_factor: 0.95

  validation_args:
    recycling_steps: 3
    sampling_steps: 200
    # CORRECTED 2026-09-16. Was 5, inherited from mhc1_finetune_8gb.yaml, which
    # descends from the full baseline config. But the 0.8827 number this run is
    # measured against came from configs/mhc1_baseline_subset30.yaml, which uses
    # 3 -- and val/lddt is a BEST-OF-N metric, not a mean:
    #
    #   model.py:704
    #     best_idx = all_lddt_dict[key].reshape(-1, n_samples).argmax(dim=1)
    #
    # Best-of-5 >= best-of-3 in expectation, always. Leaving this at 5 would have
    # produced a fine-tuned lDDT that beat the baseline with zero model
    # improvement, and there would have been no way to tell that from a real
    # result. It also costs 67% more validation compute per epoch.
    #
    # The baseline for this project is mhc1_baseline_subset30.yaml, NOT
    # mhc1_baseline.yaml (which has never been run). Any change here must be
    # mirrored there, or the comparison stops meaning anything.
    diffusion_samples: 3
    symmetry_correction: true
    run_confidence_sequentially: false

  diffusion_process_args:
    sigma_min: 0.0004
    sigma_max: 160.0
    sigma_data: 16.0
    rho: 7
    P_mean: -1.2
    P_std: 1.5
    gamma_0: 0.8
    gamma_min: 1.0
    noise_scale: 1.0
    step_scale: 1.0
    coordinate_augmentation: true
    alignment_reverse_diff: true
    synchronize_sigmas: true
    use_inference_model_cache: true

  diffusion_loss_args:
    add_smooth_lddt_loss: true
    nucleotide_loss_weight: 5.0
    ligand_loss_weight: 10.0

  # Boltz v1.0.0 made `steering_args` a REQUIRED argument of Boltz1.__init__ but
  # never updated scripts/train/configs/*.yaml, so the upstream training configs
  # cannot be instantiated as shipped (TypeError on hydra.utils.instantiate).
  # This block is the fix.
  #
  # Values mirror `boltz predict --no_potentials`. Steering is an inference-time
  # trick, not part of the training objective, so leaving it off is what makes
  # the validation metric a clean measure of the model itself. It also matters
  # for memory: model.py calls structure_module.sample() whenever the module is
  # not in training mode, and fk_steering with num_particles=3 would triple the
  # diffusion batch on top of diffusion_samples.
  steering_args:
    fk_steering: false
    num_particles: 3
    fk_lambda: 4.0
    fk_resampling_interval: 3
    guidance_update: false
    num_gd_steps: 16

# MEASURED (2026-09-15): freezing only msa_module + pairformer_module does NOT
# stop their activations being retained. Autograd retains activations based on
# whether a tensor is needed for SOME backward pass, not on whether the local
# module's weights are trainable. z entering the pairformer is built by
# z_init_1/z_init_2/rel_pos/token_bonds from input_embedder output -- all still
# trainable -- so gradients must flow back THROUGH all 48 frozen blocks to reach
# them, and every block's activations are kept to make that possible.
#
# Result: 13.09 GiB on a 14.56 GiB card, OOM at batch 24. The freeze saved the
# optimizer state and bought nothing on activations.
#
# Freezing everything upstream of the structure module makes z.requires_grad
# False, so no graph is built through the trunk at all and the activations are
# simply never kept. Cost: 1.6M more frozen params out of 432M. What stays
# trainable is structure_module (280M) + distogram_module (8.3K), which IS the
# strategy as described to Ernest -- "freeze the trunk and fine-tune only the
# structure module". The earlier list was a partial version of that.
freeze_trunk:                         # DEVIATION: see header note 2.
  - input_embedder
  - s_init
  - z_init_1
  - z_init_2
  - token_bonds
  - rel_pos
  - s_norm
  - z_norm
  - s_recycle
  - z_recycle
  - msa_module
  - pairformer_module
