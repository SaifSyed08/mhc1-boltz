# GENERATED FILE -- do not edit by hand.
# 30-sample subset variant: same as mhc1_baseline.yaml but `split` points at
# validation_ids_subset30.txt (seed 42; ids in data/processed/subset30_ids.txt).
# A CLI override cannot do this -- OmegaConf.from_dotlist cannot index a list,
# so `data.datasets.0.split=...` fails with 'Cannot merge DictConfig with ListConfig'.
# Regenerate with:  python src/make_baseline_config.py
# Source of truth:  configs/mhc1_finetune.yaml
#
# Boltz-1 MHC-I fine-tuning configuration.
#
# Derived from boltz-src/scripts/train/configs/structure.yaml. Only the data,
# checkpoint and schedule sections differ from the upstream template; the model
# block is left byte-identical so the pretrained weights load without surprises.
#
# All paths are relative to boltz-src/, which is the working directory the
# upstream entry point assumes (`python scripts/train/train.py <config>`), so
# `../data/...` lands in this repo. Nothing here is machine-specific except the
# wandb entity -- the tree can be copied to a cluster and run unchanged.
#
# Assets are in data/assets/ (fetched by src/fetch_assets.py) and data/msa/
# (fetched by src/msa_extract.py).
#
# NOTE ON GPU MEMORY: this config cannot fine-tune on an 8 GB card. See
# reports/GPU_REQUIREMENTS.md for the arithmetic; use configs/mhc1_baseline.yaml
# for the pretrained validation_only baseline, which is the step brief section 7
# asks for before training.
#
# Notes on the data wiring, which is where this differs meaningfully from the
# template:
#
#  * `manifest_path` points at our processed manifest, which contains ONLY the
#    train and validation samples. Boltz sends every manifest record that is not
#    named in `split` into training, and applies `filters` to the training side
#    only -- so the test set is physically absent from this manifest rather than
#    merely filtered out. Test records live in processed/manifest_test.json.
#  * `split` names the VALIDATION ids (Boltz's convention; it is not a
#    three-way split). It points at validation_ids_boltz.txt = the upstream
#    scripts/train/assets/validation_ids.txt contents plus our MHC-I validation
#    ids. The brief asks for our ids to be added to that upstream file; note the
#    upstream list has ZERO overlap with this manifest (552 ids, none of them
#    MHC-I), so pointing `split` at the upstream file alone would produce an
#    EMPTY validation set. The merged file is both literal and correct.
#  * `samples_per_epoch: 100` per the brief.
#  * The DateFilter is kept at the train/validation boundary as a second line of
#    defence; with the manifest already partitioned it should be a no-op.

trainer:
  accelerator: gpu
  devices: 1
  precision: 32
  gradient_clip_val: 10.0
  max_epochs: -1
  accumulate_grad_batches: 128

wandb:
  name: boltz1-mhc1-finetune
  project: boltz-mhc1
  entity: YOUR_WANDB_ENTITY           # <- the only value still needing your input

output: ../runs/baseline              # run output directory
pretrained: ../data/assets/boltz1_conf.ckpt   # 606M params; resume from pretrained weights
resume: null                          # null so `pretrained` is used for a fresh fine-tune run
disable_checkpoint: true              # nothing is trained, nothing to save
matmul_precision: null
save_top_k: -1

data:
  datasets:
    - _target_: boltz.data.module.training.DatasetConfig
      target_dir: ../data/processed
      msa_dir: ../data/msa
      manifest_path: ../data/processed/manifest.json
      prob: 1.0
      sampler:
        _target_: boltz.data.sample.cluster.ClusterSampler
      cropper:
        _target_: boltz.data.crop.boltz.BoltzCropper
        min_neighborhood: 0
        max_neighborhood: 40
      split: ../data/processed/validation_ids_subset30.txt

  filters:
    - _target_: boltz.data.filter.dynamic.size.SizeFilter
      min_chains: 1
      max_chains: 300
    - _target_: boltz.data.filter.dynamic.date.DateFilter
      date: "2021-09-30"
      ref: released
    - _target_: boltz.data.filter.dynamic.resolution.ResolutionFilter
      resolution: 9.0

  tokenizer:
    _target_: boltz.data.tokenize.boltz.BoltzTokenizer
  featurizer:
    _target_: boltz.data.feature.featurizer.BoltzFeaturizer

  symmetries: ../data/assets/symmetry.pkl
  max_tokens: 512
  max_atoms: 4608
  max_seqs: 2048
  pad_to_max_tokens: true
  pad_to_max_atoms: true
  pad_to_max_seqs: true
  samples_per_epoch: 100
  batch_size: 1
  num_workers: 4
  random_seed: 42
  pin_memory: true
  overfit: null
  crop_validation: false
  return_train_symmetries: false
  return_val_symmetries: true
  train_binder_pocket_conditioned_prop: 0.3
  val_binder_pocket_conditioned_prop: 0.3
  binder_pocket_cutoff: 6.0
  binder_pocket_sampling_geometric_p: 0.3
  min_dist: 2.0
  max_dist: 22.0
  num_bins: 64
  atoms_per_window_queries: 32

model:
  _target_: boltz.model.model.Boltz1
  atom_s: 128
  atom_z: 16
  token_s: 384
  token_z: 128
  num_bins: 64
  atom_feature_dim: 389
  atoms_per_window_queries: 32
  atoms_per_window_keys: 128
  compile_pairformer: false
  nucleotide_rmsd_weight: 5.0
  ligand_rmsd_weight: 10.0
  ema: false                          # no-op for a fresh checkpoint; saves 3.63 GB
  ema_decay: 0.999

  embedder_args:
    atom_encoder_depth: 3
    atom_encoder_heads: 4

  msa_args:
    msa_s: 64
    msa_blocks: 4
    msa_dropout: 0.15
    z_dropout: 0.25
    pairwise_head_width: 32
    pairwise_num_heads: 4
    activation_checkpointing: true
    offload_to_cpu: true            # MEMORY FIX, numerically identical:
                                    # fairscale checkpoint_wrapper parks checkpointed
                                    # activations on CPU. The OOM was in the MSA
                                    # module (pair_averaging einsum), which scales
                                    # with max_seqs/tokens -- NOT with
                                    # diffusion_samples. Unlike cutting max_seqs or
                                    # diffusion_samples, this changes no numbers.

  pairformer_args:
    num_blocks: 48
    num_heads: 16
    dropout: 0.25
    activation_checkpointing: true
    offload_to_cpu: true            # MEMORY FIX, numerically identical:
                                    # fairscale checkpoint_wrapper parks checkpointed
                                    # activations on CPU. The OOM was in the MSA
                                    # module (pair_averaging einsum), which scales
                                    # with max_seqs/tokens -- NOT with
                                    # diffusion_samples. Unlike cutting max_seqs or
                                    # diffusion_samples, this changes no numbers.

  score_model_args:
    sigma_data: 16
    dim_fourier: 256
    atom_encoder_depth: 3
    atom_encoder_heads: 4
    token_transformer_depth: 24
    token_transformer_heads: 16
    atom_decoder_depth: 3
    atom_decoder_heads: 4
    conditioning_transition_layers: 2
    activation_checkpointing: true
    offload_to_cpu: true            # MEMORY FIX, numerically identical:
                                    # fairscale checkpoint_wrapper parks checkpointed
                                    # activations on CPU. The OOM was in the MSA
                                    # module (pair_averaging einsum), which scales
                                    # with max_seqs/tokens -- NOT with
                                    # diffusion_samples. Unlike cutting max_seqs or
                                    # diffusion_samples, this changes no numbers.

  confidence_prediction: false
  confidence_model_args:
    num_dist_bins: 64
    max_dist: 22
    add_s_to_z_prod: true
    add_s_input_to_s: true
    use_s_diffusion: true
    add_z_input_to_z: true

    confidence_args:
      num_plddt_bins: 50
      num_pde_bins: 64
      num_pae_bins: 64

  training_args:
    recycling_steps: 3
    sampling_steps: 20
    diffusion_multiplicity: 16
    diffusion_samples: 2
    confidence_loss_weight: 1e-4
    diffusion_loss_weight: 4.0
    distogram_loss_weight: 3e-2
    adam_beta_1: 0.9
    adam_beta_2: 0.95
    adam_eps: 0.00000001
    lr_scheduler: af3
    base_lr: 0.0
    max_lr: 0.0018
    lr_warmup_no_steps: 1000
    lr_start_decay_after_n_steps: 50000
    lr_decay_every_n_steps: 50000
    lr_decay_factor: 0.95

  validation_args:
    recycling_steps: 3
    sampling_steps: 200
    diffusion_samples: 3            # DEVIATION: 5 in mhc1_baseline.yaml.
                                    # The diffusion batch scales with this, and it is the
                                    # largest single memory lever. At 5 this run died with
                                    # CUDA OOM in pair_averaging.py einsum on sample 3:
                                    # Boltz caught the first OOM ('skipping batch') but a
                                    # second one landed outside its try/except and killed
                                    # the process. Also ~40% faster.
                                    # NOTE: best_rmsd becomes best-of-3, and the fine-tuned
                                    # model MUST be scored with the same value.
    symmetry_correction: true
    run_confidence_sequentially: false

  diffusion_process_args:
    sigma_min: 0.0004
    sigma_max: 160.0
    sigma_data: 16.0
    rho: 7
    P_mean: -1.2
    P_std: 1.5
    gamma_0: 0.8
    gamma_min: 1.0
    noise_scale: 1.0
    step_scale: 1.0
    coordinate_augmentation: true
    alignment_reverse_diff: true
    synchronize_sigmas: true
    use_inference_model_cache: true

  diffusion_loss_args:
    add_smooth_lddt_loss: true
    nucleotide_loss_weight: 5.0
    ligand_loss_weight: 10.0

  # Boltz v1.0.0 made `steering_args` a REQUIRED argument of Boltz1.__init__ but
  # never updated scripts/train/configs/*.yaml, so the upstream training configs
  # cannot be instantiated as shipped (TypeError on hydra.utils.instantiate).
  # This block is the fix.
  #
  # Values mirror `boltz predict --no_potentials`. Steering is an inference-time
  # trick, not part of the training objective, so leaving it off is what makes
  # the validation metric a clean measure of the model itself. It also matters
  # for memory: model.py calls structure_module.sample() whenever the module is
  # not in training mode, and fk_steering with num_particles=3 would triple the
  # diffusion batch on top of diffusion_samples.
  steering_args:
    fk_steering: false
    num_particles: 3
    fk_lambda: 4.0
    fk_resampling_interval: 3
    guidance_update: false
    num_gd_steps: 16

# ---------------------------------------------------------------------------
# Baseline-only settings (see src/make_baseline_config.py)
#
# validation_only: run trainer.validate() instead of trainer.fit(). No optimizer
#   is constructed and no gradients are held, which is the only reason this fits
#   on an 8 GB card at all -- see reports/GPU_REQUIREMENTS.md.
#
# debug: train.py treats this as "local sanity run": it forces devices=1,
#   num_workers=0, and sets wandb to None. That last part is what lets this run
#   without a Weights & Biases account; the fine-tuning run still logs to W&B as
#   the brief asks.
# ---------------------------------------------------------------------------
validation_only: true
debug: true
